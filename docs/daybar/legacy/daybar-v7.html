<title>Daybar</title>
<script type="application/json" id="claude-artifacts-manifest">{"permissions": ["full-access"]}</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: warm canvas holds the sidebar (search, lists, month, day stepper); the day lives in an inset rounded panel with sectioned cards; a glass Day Bar floats at the bottom.
   System: a 4px spacing grid, one radius scale, weights 500/600 (700 only for the page title and the time stamp), Lucide icons at 12/14/18, every control answers hover and press. */
:root{
  --bg:#f1f1f2; --canvas:#e8e8e9; --tert:#dcdcde; --surface:#ffffff; --hover:#f4f3f1; --press:#ebeae7;
  --fg:#171716; --fg2:#595854; --fg3:#72716d; --sep:#1717191a; --sep-soft:#1717190f; --box-line:rgba(114,113,109,.55);
  --accent:#ff3157; --accent-fill:#d62949; --on-accent:#ffffff; --ink-l:#c72644; --ink-d:#ff3157; --accent-ink:var(--ink-l); --chip-mix:62%;
  --red:#e84b5b; --blue:#3276e8; --green:#2fae5b; --orange:#d98b0b; --purple:#8e56d2; --teal:#0f8fa3; --pink:#d63d8f; --gray:#6c6b68; --yellow:#c99a06;
  --glass:#ffffff80; --glass-strong:#ffffffd9; --glass-outline:#0000000f; --rim-top:#fffffff2; --rim-bottom:#0000000d; --sheen:#ffffff8c;
  --glass-shadow:0 14px 40px #14141e1f,0 2px 8px #14141e0f; --blur:blur(20px) saturate(190%) brightness(1.03);
  --lift:0 1px 2px #0000000d; --lift-2:0 1px 3px #0000001a;
  --font:"SF Pro Rounded",ui-rounded,Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:14px; --r-xl:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121211; --canvas:#232220; --tert:#31302d; --surface:#1d1c1b; --hover:#292827; --press:#34332f;
  --fg:#f6f5f3; --fg2:#a9a7a3; --fg3:#93918d; --sep:#ffffff1a; --sep-soft:#ffffff0f; --box-line:rgba(147,145,141,.6);
  --accent-ink:var(--ink-d); --chip-mix:82%;
  --red:#ff6f7d; --blue:#66a1ff; --green:#49cc76; --orange:#f9ba3e; --purple:#b183ef; --teal:#4fd1e0; --pink:#ff7ab8; --gray:#a9a7a3; --yellow:#f5cf47;
  --glass:#2c2c2e75; --glass-strong:#2e2e30e6; --glass-outline:#ffffff14; --rim-top:#ffffff38; --rim-bottom:#00000059; --sheen:#ffffff1a;
  --glass-shadow:0 14px 40px #00000073,0 2px 8px #0000004d; --blur:blur(20px) saturate(170%) brightness(.95);
  --lift:0 0 0 1px #ffffff0a; --lift-2:0 0 0 1px #ffffff14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121211; --canvas:#232220; --tert:#31302d; --surface:#1d1c1b; --hover:#292827; --press:#34332f;
  --fg:#f6f5f3; --fg2:#a9a7a3; --fg3:#93918d; --sep:#ffffff1a; --sep-soft:#ffffff0f; --box-line:rgba(147,145,141,.6);
  --accent-ink:var(--ink-d); --chip-mix:82%;
  --red:#ff6f7d; --blue:#66a1ff; --green:#49cc76; --orange:#f9ba3e; --purple:#b183ef; --teal:#4fd1e0; --pink:#ff7ab8; --gray:#a9a7a3; --yellow:#f5cf47;
  --glass:#2c2c2e75; --glass-strong:#2e2e30e6; --glass-outline:#ffffff14; --rim-top:#ffffff38; --rim-bottom:#00000059; --sheen:#ffffff1a;
  --glass-shadow:0 14px 40px #00000073,0 2px 8px #0000004d; --blur:blur(20px) saturate(170%) brightness(.95);
  --lift:0 0 0 1px #ffffff0a; --lift-2:0 0 0 1px #ffffff14; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--canvas);color:var(--fg);font:500 14px/1.35 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--canvas)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.glass{background:linear-gradient(var(--sheen),transparent 45%),var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:inset 0 1px .5px var(--rim-top),inset 0 -1px .5px var(--rim-bottom),0 0 0 .5px var(--glass-outline),var(--glass-shadow)}
.glass.strong{background:linear-gradient(var(--sheen),transparent 30%),var(--glass-strong)}
.solid .glass{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 0 0 .5px var(--sep),0 8px 24px #00000029}
kbd,.kbd,.keys dt{font:500 11px/1 var(--mono);color:var(--fg2);background:var(--bg);border:1px solid var(--sep);border-bottom-width:2px;border-radius:var(--r-xs);padding:3px 6px;white-space:nowrap}

/* interaction: a color step on hover, a small press, nothing grows or glows */
:is(.nav button,.arrow,.mm-d,.st-btn,.st-mid,.tbtn,.seg button,.pop button,.cbox,.d7,.btn,.link,.ibtn,.mic,.del,.db-ic,.db-mid,.db-add,.pal-item,.whead,.mc,.ym-name,.swatch,.play,.rec-btn,.card,.tile,.track,.field,.prow,.pchip,.ktab,.kchip,.rbtn,.pp-item,.ccheck,.pp-chip){
  transition:background-color .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease),box-shadow .15s var(--ease),transform .09s var(--ease)}
:is(.arrow,.st-btn,.tbtn,.cbox,.d7,.btn,.ibtn,.mic,.del,.db-ic,.db-add,.swatch,.play,.rec-btn,.seg button,.mm-d,.pchip,.ktab,.kchip,.rbtn,.ccheck,.pp-chip):active:not(:disabled){transform:scale(.96)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes drop{from{opacity:0;transform:translate(-50%,-8px)}}

:root{--side-w:240px}
.app{display:flex;min-height:100vh}

/* sidebar */
.side{position:sticky;top:0;height:100vh;width:var(--side-w);flex:none;display:flex;flex-direction:column;gap:8px;overflow-y:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-md);padding:0 8px 0 12px;height:36px;box-shadow:var(--lift);color:var(--fg3);cursor:text}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px}
.search input::placeholder{color:var(--fg3)}
.search input::-webkit-search-cancel-button{display:none}
.search:focus-within{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
.nav{display:grid;gap:2px;margin-top:8px}
.nav button{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border:0;border-radius:var(--r-md);background:transparent;font-size:14px;font-weight:600;text-align:left;width:100%}
.nav button .ic{color:var(--fg2)}
.nav button:hover{background:var(--hover)}
.nav button[aria-current="page"]{background:var(--surface);box-shadow:var(--lift-2)}
.nav button[aria-current="page"] .ic{color:var(--fg)}
.nav .count{margin-left:auto;color:var(--fg3);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.rule{height:1px;background:var(--sep);margin:8px 12px}
.side-foot{margin-top:auto;display:grid;gap:12px;padding-top:16px}
.mm-head{display:flex;align-items:center;gap:2px;padding:0 4px 4px}
.mm-head b{font-size:13px;font-weight:600;color:var(--fg2);margin-right:auto}
.arrow{width:28px;height:28px;border:0;background:transparent;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--fg3)}
.arrow:hover{background:var(--hover);color:var(--fg)}
.mm{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.mm-wd{font-size:11px;font-weight:500;color:var(--fg3);padding:4px 0}
.mm-d{height:28px;border:0;border-radius:var(--r-sm);background:transparent;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;position:relative}
.mm-d:hover{background:var(--hover)}
.mm-d.out{color:var(--fg3);opacity:.7}
.mm-d.today{color:var(--accent-ink)}
.mm-d.sel{background:var(--surface);box-shadow:var(--lift-2)}
.mm-d.has::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--fg3)}
.stepper{display:flex;align-items:center;height:48px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--lift);padding:0 4px}
.st-btn{width:32px;height:40px;border:0;background:transparent;border-radius:var(--r-md);display:grid;place-items:center;color:var(--fg2)}
.st-btn:hover{background:var(--hover)}
.st-mid{flex:1;border:0;background:transparent;display:grid;justify-items:center;line-height:1.3;border-radius:var(--r-md);padding:4px 0}
.st-mid:hover{background:var(--hover)}
.st-mid b{font-size:14px;font-weight:600}
.st-mid span{font-size:11px;font-weight:500;color:var(--fg3)}
.st-mid span.on{color:var(--accent-ink)}

/* panel */
.panel{flex:1;min-width:0;position:relative;z-index:2;background:var(--bg);margin:8px 8px 8px 0;border-radius:var(--r-lg);min-height:calc(100vh - 16px);
  box-shadow:0 0 0 .5px var(--sep),0 2px 12px #0000000d}
.col{max-width:704px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:48px 160px}
.col.wide{max-width:1064px}
.head{display:flex;align-items:flex-start;gap:12px;margin-bottom:24px;position:relative}
.titles{margin-right:auto;min-width:0}
h1{font:700 28px/1.15 var(--font);margin:0;text-wrap:balance}
.date{margin:4px 0 0;font-size:13px;color:var(--fg3);font-weight:500}
.tools{display:flex;align-items:center;gap:8px}
.tbtn{position:relative;width:36px;height:36px;border:0;background:transparent;display:grid;place-items:center;border-radius:50%;flex:none;color:var(--fg2)}
.tbtn:hover{background:var(--hover);color:var(--fg)}
.tbtn.glass:hover{filter:brightness(1.06)}
.badge{position:absolute;top:-2px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--accent-fill);color:var(--on-accent);font-size:11px;font-weight:600;line-height:1;display:grid;place-items:center;font-variant-numeric:tabular-nums;border:2px solid var(--bg)}
.seg{display:inline-flex;background:var(--tert);border-radius:var(--r-md);padding:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:600;color:var(--fg2)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--lift-2)}
.pop{position:absolute;right:0;top:44px;z-index:40;min-width:232px;border-radius:var(--r-lg);padding:4px;display:grid;gap:2px}
.pop:not([hidden]){animation:rise .18s var(--ease)}
.pop button{border:0;background:transparent;text-align:left;padding:8px 12px;border-radius:var(--r-md);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:16px}
.pop button:hover{background:var(--hover)}

/* sections + rows */
.sec{border-top:1px dashed var(--sep);padding:12px 0 16px}
.sec:first-child{border-top:0;padding-top:0}
.sec summary{display:flex;align-items:center;gap:8px;list-style:none;cursor:pointer;padding:4px 4px 8px;user-select:none;border-radius:var(--r-sm)}
.sec summary::-webkit-details-marker{display:none}
.sec summary>.ic{color:var(--fg2)}
.sec-t{font-size:16px;font-weight:600}
.sec-n{font-size:13px;color:var(--fg3);font-weight:500;font-variant-numeric:tabular-nums}
.chev{margin-left:auto;color:var(--fg3);display:grid;transition:transform .18s var(--ease);transform:rotate(-90deg)}
.sec[open] .chev{transform:none}
.rows{display:grid;gap:4px}
.it{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center}
.it.compact{grid-template-columns:minmax(0,1fr)}
.gut{display:flex;justify-content:flex-end}
.tm{display:inline-flex;align-items:flex-start;font-variant-numeric:tabular-nums}
.tm b{font-size:18px;font-weight:700;line-height:1}
.tm-r{display:flex;flex-direction:column;line-height:1;margin-left:1px}
.tm-r sup{font-size:10px;font-weight:600;vertical-align:baseline}
.tm-r small{font-size:9px;font-weight:600;color:var(--fg3);margin-top:2px}
.overdue{color:var(--red);display:grid}
.card{display:flex;align-items:center;gap:12px;min-height:44px;background:var(--surface);border-radius:var(--r-md);padding:8px 12px;box-shadow:var(--lift);min-width:0}
.card:has(.cbody:hover){background:var(--hover)}
.cbody{flex:1;min-width:0;display:grid;gap:2px;align-content:center;align-self:stretch;border:0;background:transparent;padding:0;text-align:left} /* the whole row height is the tap target */
.ttl{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.sub{font-size:12px;color:var(--fg3);font-weight:500;overflow-wrap:anywhere}
.done .ttl{text-decoration:line-through;color:var(--fg3)}
.cbox,.tbox{width:20px;height:20px;flex:none;border-radius:var(--r-xs);border:1px solid var(--box-line);display:grid;place-items:center;padding:0;color:var(--fg2)}
.cbox{background:var(--surface);position:relative}
.cbox .ic{opacity:.45}
.cbox:hover:not(:disabled){border-color:var(--accent);color:var(--accent-ink)}
.cbox[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cbox[aria-pressed="true"] .ic{opacity:1;stroke-width:2.5}
.cbox:disabled{opacity:.45}
.thumb{width:32px;height:32px;flex:none;border-radius:var(--r-sm);object-fit:cover;background:var(--tert);display:block}
.end{display:flex;align-items:center;gap:8px;flex:none;color:var(--fg3)}
.end a{display:grid;text-decoration:none;border-radius:var(--r-xs)}
.end a:hover{color:var(--fg)}
.flag .ic{fill:currentColor}
.flag.high{color:var(--red)}.flag.medium{color:var(--blue)}.flag.low{color:var(--fg3)}
.steps{font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;color:color-mix(in srgb,var(--c) var(--chip-mix),var(--fg));background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap;border:0;text-decoration:none}
.chip.cat::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip.act{--c:var(--accent)}
a.chip:hover,button.chip:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.voice{display:flex;align-items:center;gap:8px;flex:none}
.play{width:24px;height:24px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);display:grid;place-items:center;padding:0;flex:none}
.play .ic{fill:currentColor}
.wave{display:flex;align-items:center;gap:2px;height:16px}
.wave i{width:2px;border-radius:1px;background:var(--fg3)}
.speaking .wave i{background:var(--accent)}
.vlen{font-size:12px;color:var(--fg3);font-weight:500;font-variant-numeric:tabular-nums}
.quick .card{background:transparent;border:1px dashed var(--sep);box-shadow:none}
.quick .card:hover{border-color:var(--box-line)}
.quick input{flex:1;align-self:stretch;min-width:0;border:0;background:transparent;outline:none;font-size:14px;font-weight:600;padding:4px 0}
.quick input::placeholder{color:var(--fg3);font-weight:500}
.quick .cbox{border-style:dashed;background:transparent}
.hint-line{color:var(--fg3);font-weight:500;margin:0 0 16px 56px}
.empty{background:var(--surface);border-radius:var(--r-lg);padding:32px 24px;text-align:center;color:var(--fg3);font-weight:500}
.empty strong{display:block;color:var(--fg);font-size:16px;font-weight:600;margin-bottom:4px}
.group{font-size:13px;font-weight:600;color:var(--fg2);margin:24px 0 8px}
.group:first-child{margin-top:0}

/* habits, categories, moments */
.hab{flex-wrap:wrap;padding:12px}
.week7{display:flex;gap:4px}
.d7{width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--box-line);background:transparent;font-size:11px;font-weight:600;color:var(--fg3);padding:0}
.d7:hover:not(:disabled){border-color:var(--accent);color:var(--fg)}
.d7.now{border-color:var(--accent);color:var(--fg)}
.d7[aria-pressed="true"]{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.d7:disabled{opacity:.4}
.cdot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;margin:0 4px}
.moments{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:12px}
.tile{border:0;padding:0;background:var(--surface);border-radius:var(--r-lg);overflow:hidden;text-align:left;display:grid;min-width:0;box-shadow:var(--lift)}
.tile:hover{box-shadow:var(--lift-2),0 8px 24px #0000000f}
.tile img,.tile video,.tile .ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--tert)}
.tile .ph{display:grid;place-items:center;color:var(--fg3)}
.tile span{padding:8px 12px 2px;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{padding:0 12px 12px;font-size:11px;color:var(--fg3);font-weight:500}

/* calendar */
.recap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border-radius:var(--r-lg);padding:12px 16px;box-shadow:var(--lift)}
.stat b{display:block;font-size:24px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--fg3);font-weight:500}
.recap p{grid-column:1/-1;margin:0;color:var(--fg2);font-weight:500}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:start}
.wday{background:var(--surface);border-radius:var(--r-lg);min-width:0;padding-bottom:8px;box-shadow:var(--lift)}
.wday.is-sel{box-shadow:0 0 0 1.5px var(--fg3)}
.whead{display:flex;align-items:baseline;gap:8px;width:100%;border:0;background:transparent;padding:12px 12px 8px;text-align:left;border-radius:var(--r-lg) var(--r-lg) 0 0}
.whead:hover .dn{color:var(--accent-ink)}
.whead .wd{font-size:12px;font-weight:600;color:var(--fg3)}
.whead .dn{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.is-today .whead .wd,.is-today .whead .dn{color:var(--accent-ink)}
.wday .rows{gap:4px;padding:0 8px}
.wday .card{min-height:0;padding:4px 8px;gap:8px;background:var(--bg);box-shadow:none}
.wday .ttl{font-size:13px}
.wday .sub{font-size:11px}
.wday .cbox,.wday .tbox,.wday .thumb{width:16px;height:16px;border-radius:4px}
.wday .end,.wday .voice{display:none}
.free{font-size:13px;color:var(--fg3);margin:0;padding:0 12px 4px;font-weight:500}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--lift)}
.mh{font-size:12px;font-weight:600;color:var(--fg3);padding:8px}
.mc{min-height:104px;min-width:0;border:0;border-top:1px solid var(--sep-soft);background:transparent;text-align:left;padding:6px;display:flex;flex-direction:column;gap:4px}
.mc:not(:nth-child(7n+1)){border-left:1px solid var(--sep-soft)}
.mc:hover{background:var(--hover)}
.mc.out{opacity:.4}
.mc .num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.mc.today .num{background:var(--accent-fill);color:var(--on-accent)}
.mc.sel:not(.today) .num{background:var(--tert)}
.mi{font-size:12px;font-weight:500;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid var(--c,var(--fg3));padding-left:4px}
.mi.done{color:var(--fg3);text-decoration:line-through}
.more{font-size:11px;color:var(--fg3);font-weight:500}
.dots{display:none;gap:4px}
.dot{width:4px;height:4px;border-radius:50%;background:var(--c,var(--accent))}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px}
.ym{background:var(--surface);border-radius:var(--r-lg);padding:12px 12px 8px;box-shadow:var(--lift)}

/* ---------- import / export ---------- */

  let list, text = '';

  let d = null;

  const fresh = list.filter(it => !S.items.has(it.id)).length;
  const changed = list.filter(it => JSON.stringify(S.items.get(it.id)) !== JSON.stringify(it));

});

/* ---------- sync with ThisDay: in through its export, out through a file its Shortcuts actions read ---------- */
function applyThisDay(d, auto = false) {
  const at = typeof d.exportedAt === 'string' ? d.exportedAt.slice(0, 40) : '', last = S.settings.sync.lastExport;
  if (last && at && at < last) { if (!auto) toast('That ThisDay export is older than the one Daybar already has, so nothing changed.'); return 'old'; }
  const r = fromThisDay(d), m = mergeThisDay(S.items, r.items);
  const commit = () => {
    const fresh = r.items.filter(t => !S.items.has(t.id)).length, seen = it => JSON.stringify({ ...it, tdDone: 0 });
    const changed = [...m.items.values()].filter(it => JSON.stringify(S.items.get(it.id)) !== JSON.stringify(it));
    const updated = changed.filter(it => S.items.has(it.id) && seen(S.items.get(it.id)) !== seen(it)).length; // not counting Daybar's own bookkeeping
    for (const id of m.removed) S.items.delete(id);
    store.persist(m.removed); store.saveMany(changed, false);
    const keys = new Set(outbox(m.items.values(), []).map(c => c.key)); // forget sends ThisDay now shows
    setSettings({ categories: r.cats.length ? tdCategories(r.cats, r.items) : S.settings.categories, sync: { lastExport: at || last, sent: S.settings.sync.sent.filter(k => keys.has(k)) } });
    toast(`Synced with ThisDay: ${fresh} new, ${updated} updated, ${m.removed.length} removed.`);
  };
  const ours = [...S.items.values()].filter(fromTD).length;
  if (m.removed.length > 20 && m.removed.length > ours / 3) { // an export from a device that hasn't caught up would empty Daybar
    if (!auto) toast(`This export would remove ${m.removed.length} items from Daybar.`, 'Sync anyway', commit);
    return 'held';
  }
  commit();
  return 'ok';
}
const pendingOut = () => outbox(S.items.values(), S.settings.sync.sent).filter(c => !c.sent);

const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
function sendToThisDay() {
  const list = pendingOut();

  if (DK?.fs && LS.get('daybar.folderOn', false)) { folderSync(true); return; } // the app writes straight into the shared folder
  const data = JSON.stringify(sendDoc(list), null, 1);
  if (!DL) {
    navigator.clipboard.writeText(data).then(() => { markSent(list); toast(`Copied ${plural(list.length, 'change')}. Run “Daybar to ThisDay” on your iPhone.`); })
      .catch(() => toast('Couldn’t copy the changes in this view.'));

  }
  DL.save({ filename: 'to-thisday.json', data })
    .then(r => { if (r.status === 'saved') { markSent(list); toast(`Saved ${plural(list.length, 'change')}. Keep to-thisday.json in iCloud Drive › Daybar, then open ThisDay.`); } })
    .catch(err => { if (err?.code !== 'declined') toast('Couldn’t save the changes. Try again.'); });
}

// The installed app can share a folder with the iPhone: iCloud Drive, through iCloud for Windows on a PC
const folder = { status: '', busy: false };
const folderPath = () => LS.get('daybar.folder', '') || (S.platform === 'darwin' ? '~/Library/Mobile Documents/com~apple~CloudDocs/Daybar' : '~/iCloudDrive/Daybar');
async function folderSync(manual = false) {
  if (!DK?.fs || folder.busy || !LS.get('daybar.folderOn', false) || S.sync !== 'ok') return; // wait until saved items have loaded
  folder.busy = true;
  const dir = folderPath().replace(/[\\/]+$/, '');
  try {
    await DK.fs.mkdir(dir, { recursive: true });
    let newest = null, note = 'No ThisDay export in the folder yet.';
    for (const e of await DK.fs.readdir(dir)) {
      if (!e.isFile || !/^ThisDay-export.*\.json$/i.test(e.name)) continue;
      const st = await DK.fs.stat(dir + '/' + e.name);
      if (!newest || st.mtimeMs > newest.m) newest = { name: e.name, m: st.mtimeMs };
    }
    if (newest) {
      note = `Up to date with ${newest.name}.`;
      if (newest.m !== LS.get('daybar.folderSeen', 0)) {
        let d = null;
        try { d = JSON.parse((await DK.fs.readFile(dir + '/' + newest.name, 'utf8')).replace(/^﻿/, '')); } catch {}
        const r = isThisDay(d) ? applyThisDay(d, !manual) : 'bad';
        if (r === 'held') note = `${newest.name} would remove many items, so it waits. Import it from here to check it.`;
        else { LS.set('daybar.folderSeen', newest.m); if (r === 'bad') note = `${newest.name} isn’t a ThisDay export Daybar can read.`; }
      }
    }
    const list = pendingOut();
    if (list.length) {
      const path = dir + '/to-thisday.json';
      let prev = [];
      try { const p = JSON.parse(await DK.fs.readFile(path, 'utf8')); if (Array.isArray(p?.changes)) prev = p.changes.filter(c => c && typeof c.key === 'string' && !list.some(x => x.key === c.key)); } catch {} // keep what the iPhone hasn't picked up yet
      await DK.fs.writeFile(path, JSON.stringify(sendDoc([...prev, ...list]), null, 1), 'utf8');
      markSent(list);
      note += ` Sent ${plural(list.length, 'change')} to ThisDay.`;
    }
    folder.status = `${note} Checked at ${fmtTime(hhmm(new Date()))}.`;
  } catch (e) { folder.status = 'Couldn’t use the folder: ' + String(e?.message || e).slice(0, 160); }
  folder.busy = false;
  if (S.list === 'settings' && document.activeElement?.id !== 'folderPath') render();
}
function drawIcon() {

  g.strokeStyle = '#fff'; g.lineWidth = 26; g.lineCap = g.lineJoin = 'round';

let dictTarget = null, dictBtn = null, recStart = 0, recSecs = 0, recTimer = null;

function wireDictation() {

    if (!dictTarget) return;
    const v = dictTarget.value, max = dictTarget.maxLength > 0 ? dictTarget.maxLength : 5000;
    dictTarget.value = (v ? v + text : text.trimStart()).slice(0, max);
    dictTarget.dispatchEvent(new Event('input', { bubbles: true }));
  });
  D.onPartial(({ text }) => { $('#partial').textContent = text; $('#partial').hidden = !text; });
  D.onState(({ state, reason }) => {

    if (dictBtn === $('#recBtn')) {
      if (state === 'listening' && !recTimer) { recStart = Date.now(); recTimer = setInterval(tickRec, 250); }
      if (!on && recTimer) { recSecs = recNow(); clearInterval(recTimer); recTimer = null; tickRec(); }
    }

    if (!on) {

      if (reason === 'unavailable' || reason === 'not_granted') { document.documentElement.classList.add('no-dict'); toast(reason === 'not_granted' ? 'Dictation is off for this page. Turn it on in its Permissions menu.' : 'Dictation isn’t available here. Type instead.'); }
      else if (reason === 'rate_limited') toast('Dictation is busy. Try again in a moment.');
      else if (reason === 'upstream_error') toast('Dictation stopped. Try again.');
    }

}

/* ---------- reminders (in-page only: the artifact cannot post system notifications) ---------- */
const fired = new Set();
function checkReminders() {
  const t = todayKey(), now = mins(hhmm(new Date()));
  for (const it of itemsFor(t)) {
    if (!it.remind || (checkable(it) && isDone(it, t))) continue;
    const k = it.id + '@' + t, m = mins(it.remind);

    return [...rel.map(([l, r]) => popItem(l, () => setDraft({ remind: r }), { icon: 'bell', hint: fmtTime(r), sel: draft.remind === r })), rel.length ? popSep() : null,

      popSep(), popItem('No reminder', () => setDraft({ remind: null }), { icon: 'x', sel: !draft.remind }), h('p', { class: 'pp-note', text: 'Reminders pop up while Daybar is open' })];

  link() {

        onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); save(); } } })),

  more() {

const anchorOf = key => key === 'kind' ? $('#kindBtn') : key === 'more' ? $('#itemMore') : (isNew() ? $('#pchips') : $('#props')).querySelector(`[data-prop="${key}"]`);

  const fr = form.getBoundingClientRect(), r = anchor.getBoundingClientRect(), w = pp.offsetWidth, ht = pp.offsetHeight;

form.addEventListener('click', e => {

/* to-dos */
function stepRow(s) {

}
function addStep() { const r = stepRow({ t: '', d: false }); $('#fList').append(r); r.querySelector('input').focus(); }
$('#fAddStep').onclick = addStep;
$('#fList').addEventListener('click', e => {

/* photos */
function showPreview() {
  const box = $('#mPrev');
  if (pendingUrl) box.replaceChildren(pendingFile.type.startsWith('video/') ? h('video', { src: pendingUrl, controls: true, playsInline: true }) : h('img', { src: pendingUrl, alt: 'Chosen photo' }));
  else if (draft?.photo) box.replaceChildren(thumb({ photo: draft.photo, media: draft.media }, 'img'));
  else box.replaceChildren();
  if (draft?.photo && !pendingUrl && draft.media === 'video') box.firstChild?.setAttribute?.('controls', '');
}
const uploadError = err => ({ too_large: 'That file is over 20 MB. Choose a smaller one.', unsupported_type: 'That file type can’t be stored. Use a photo, or an MP4 or WebM video.', quota_or_state: 'Photo storage is full. Delete some moments first.' }[err?.code] || 'Couldn’t upload the photo. Try again.');
$('#mFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (!/^(image\/|video\/(mp4|webm)$)/.test(f.type)) { toast('Choose a photo, or an MP4 or WebM video.'); return; }
  if (pendingUrl) URL.revokeObjectURL(pendingUrl);
  pendingFile = f; pendingUrl = URL.createObjectURL(f);
  showPreview();
  if (isNew()) return; // a new moment uploads when it is added
  if (!A) { toast('Adding photos needs Daybar open in Claude with edit access.'); return; }
  const id = editing;
  try {
    const { id: photo, media } = await uploadMedia(f);
    if (editing === id) { Object.assign(draft, { photo, media }); commit(); }
    else { const it = S.items.get(id); if (it) store.saveMany([{ ...it, photo, media }], false); }
  } catch (err) { toast(uploadError(err)); }
});
function toJpeg(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 2048 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject({ code: 'invalid_request' }), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject({ code: 'unsupported_type' }); };
    img.src = url;
  });
}
async function uploadMedia(file) {
  const video = file.type.startsWith('video/');
  if (video && file.size > 20e6) throw { code: 'too_large' };
  const blob = video ? file : await toJpeg(file), type = video ? file.type : 'image/jpeg';
  try { return { id: (await A.upload(blob, { type })).id, media: video ? 'video' : 'image' }; }
  catch (e) { if (e?.code !== 'store_unavailable') throw e; await new Promise(r => setTimeout(r, 800)); return { id: (await A.upload(blob, { type })).id, media: video ? 'video' : 'image' }; }
}

/* open, add, close */
function openSheet(it, type) {
  if (dlg.open) { endSheet(); dlg.close(); }
  opener = document.activeElement;
  editing = it ? it.id : null; original = it ? { ...it } : null;
  const base = it || newItem({ type: type || 'task', date: ['inbox', 'notes', 'settings', 'search', 'log', 'categories', 'cat', 'moments'].includes(S.list) ? (S.list === 'moments' ? todayKey() : null) : S.sel,
    category: S.list === 'cat' ? S.cat : null });
  draft = { ...base, checklist: base.checklist.map(s => ({ ...s })), days: [...base.days], doneOn: [...base.doneOn] };
  if (!it && draft.type === 'moment' && !draft.date) draft.date = todayKey();
  if (!it && draft.type === 'habit') Object.assign(draft, { repeat: 'daily', date: draft.date || todayKey() });
  $('#fTitle').value = draft.title; $('#fNotes').value = draft.notes; $('#fAddr').value = draft.address;
  $('#fList').replaceChildren(...draft.checklist.map(stepRow));
  showList = false; confirmDel = false; popFor = null; pp.hidden = true;
  recSecs = draft.secs; tickRec();
  if (pendingUrl) URL.revokeObjectURL(pendingUrl);
  pendingFile = null; pendingUrl = null; showPreview();
  $('#saveBtn').disabled = false;
  syncSheet();
  dlg.showModal();
  grow($('#fTitle')); grow($('#fNotes'));
  if (!it) $('#fTitle').focus(); else form.focus({ preventScroll: true });
}
function endSheet() {
  if (!draft) return;
  clearTimeout(typeTimer); closePop();
  if (D?.active()) D.stop();
  if (editing) {
    commit();
    const now = S.items.get(editing);
    if (now && original && JSON.stringify(now) !== JSON.stringify(original)) { store.undo.push([[editing, original]]); if (store.undo.length > 30) store.undo.shift(); } // one Undo for the whole visit
  }
  if (pendingUrl) { URL.revokeObjectURL(pendingUrl); pendingUrl = null; pendingFile = null; }
  editing = null; draft = null; original = null;
}
dlg.addEventListener('close', () => { if (dlg.open) return; endSheet(); opener?.focus?.(); }); // reopened already: the sheet before it was ended in openSheet
form.addEventListener('submit', async e => {
  e.preventDefault();
  if (!isNew()) { dlg.close(); return; }
  const btn = $('#saveBtn');
  if (btn.disabled) return;
  const type = draft.type, t = readText();
  const title = t.title || (type === 'voice' ? 'Voice note' : type === 'moment' ? 'A moment' : type === 'place' && t.address ? t.address : '');

  let { photo, media } = draft;
  if (type === 'moment' && pendingFile) {
    if (!A) { toast('Adding photos needs Daybar open in Claude with edit access.'); return; }
    btn.disabled = true; btn.textContent = 'Uploading…';
    try { ({ id: photo, media } = await uploadMedia(pendingFile)); }
    catch (err) { btn.disabled = false; btn.textContent = 'Add ' + LABEL[type].toLowerCase(); toast(uploadError(err)); return; }
  }
  const next = normalize({ ...draft, ...readText(), title, photo, media, date: draft.date || (repeats(draft) ? todayKey() : null) }, draft.id);
  if (!next) { btn.disabled = false; toast('That item couldn’t be saved. Check the title.'); return; }
  store.save(next);
  dlg.close();
  toast(`Added to ${next.date ? dayLabel(next.date) : 'the Inbox'}`, 'Open', () => { const it = S.items.get(next.id); if (it) openSheet(it); });
});
function moveTomorrow() {
  commit();
  const it = S.items.get(editing);
  editing = null; dlg.close(); // nothing left to save on close
  if (it?.date) { store.save({ ...it, date: addDays(it.date < todayKey() ? todayKey() : it.date, 1) }); toast(`Moved “${it.title}” to tomorrow`, 'Undo', () => store.undoLast()); }
}
function duplicate() {
  commit();
  const it = S.items.get(editing);
  if (!it) return;
  const id = uid(), copy = normalize({ ...it, created: Date.now(), doneOn: [], tdDone: null }, id);
  if (!copy) return;
  store.save(copy); closePop(true);
  toast(`Duplicated “${it.title}”`, 'Open', () => { const c = S.items.get(id); if (c) openSheet(c); });

function deleteItem() {
  if (!confirmDel) { confirmDel = true; showPop('more'); return; }
  const it = S.items.get(editing);
  editing = null; dlg.close();
  if (!it) return;
  // shortcut: a deleted moment keeps its stored photo so Undo can bring it back; nothing cleans up orphaned photos yet
  store.remove(it.id);
  toast(`Deleted “${it.title}”`, 'Undo', () => store.undoLast());

function renderPal() {

  const items = q ? matches(q).sort(byNewest).slice(0, 8).map(it => ({ label: it.title, hint: LABEL[it.type] + (it.date ? ' · ' + dayStr(it.date) : ''), run: () => openSheet(it) })) : [];
  palRes = [...cmds, ...items];
  palIdx = Math.max(0, Math.min(palIdx, palRes.length - 1));
  $('#palList').replaceChildren(...palRes.map((r, i) => h('button', { type: 'button', class: 'pal-item' + (i === palIdx ? ' on' : ''), role: 'option', id: 'pal-' + i, 'aria-selected': String(i === palIdx), 'data-i': String(i) },
    h('span', { text: r.label }), h('span', { text: r.hint }))));

}
function openPalette() { closePop(); opener = document.activeElement; palIdx = 0; $('#palQ').value = ''; renderPal(); pal.showModal(); $('#palQ').focus(); }
function runPal(i) { const r = palRes[i]; if (!r) return; pal.close(); r.run(); }

$('#palQ').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); palIdx = (palIdx + 1) % Math.max(1, palRes.length); renderPal(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); palIdx = (palIdx - 1 + palRes.length) % Math.max(1, palRes.length); renderPal(); }
  else if (e.key === 'Enter') { e.preventDefault(); runPal(palIdx); }
});
$('#palList').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) runPal(+b.dataset.i); });
pal.addEventListener('click', e => { if (e.target === pal) pal.close(); });

let toastTimer;

  el.replaceChildren(h('span', { text: msg }), ...(action ? [h('button', { type: 'button', text: action, onclick: () => { el.hidden = true; fn(); } })] : [])); // replaceChildren would print a null
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, action ? 7000 : 4500);
}

applySettings();
setSide(false);
let lastDay = todayKey();
setInterval(() => { if (todayKey() !== lastDay) { lastDay = todayKey(); if (!anyDialog()) render(); } }, 60000); // roll over at midnight
render();
connect();
})();
