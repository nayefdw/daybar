# Builds Daybar's Docker image and publishes it to the GitHub Container
# Registry on every push to main (and by hand: Actions → Docker image →
# Run workflow):
#   ghcr.io/nayefdw/daybar:latest        the newest main
#   ghcr.io/nayefdw/daybar:sha-abc1234   every build
# For linux/amd64 only: the production server is an x86_64 VM. Adapted from
# flowplan's image workflow, without its releases, archives, arm64 build and
# Coolify roll-outs; the server pulls :latest itself.
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push replaces a build still running.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # Only this repository publishes (a fork's run would push elsewhere).
    if: github.repository == 'nayefdw/daybar'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FLOWPLAN_SKIP_TYPECHECK=1
            GIT_COMMIT=${{ github.sha }}
            FLOWPLAN_CHANNEL=release
          # GitHub's Actions cache, kept between runs: a push that changes
          # only the app rebuilds the app, not the base layers.
          cache-from: type=gha,scope=image-linux-amd64
          cache-to: type=gha,scope=image-linux-amd64,mode=max
      - name: Summary
        run: |
          {
            echo "Published for linux/amd64:"
            echo
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
