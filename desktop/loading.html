<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'"><title>Daybar</title><style>
:root{color-scheme:light dark;font-family:Segoe UI,system-ui,sans-serif;color:#242332;background:#f8f8fb}body{margin:0;display:grid;place-items:center;min-height:100vh}.card{text-align:center;padding:32px}img{width:72px;height:72px;border-radius:20px}h1{font-size:26px;letter-spacing:-1px;margin:20px 0 8px}p{font-size:14px;color:#747284;line-height:1.7;margin:0}.bar{height:3px;width:120px;background:#e5e4ef;border-radius:3px;margin:26px auto;overflow:hidden}.bar:after{content:'';display:block;height:100%;width:40%;background:#5851de;animation:move 1.2s infinite ease-in-out}@keyframes move{from{transform:translateX(-100%)}to{transform:translateX(350%)}}@media(prefers-reduced-motion:reduce){.bar:after{animation:none;width:100%}}@media(prefers-color-scheme:dark){:root{color:#f2f1fa;background:#19191f}p{color:#aaa7b9}.bar{background:#35333f}}
</style></head><body><main class="card"><img src="assets/icon.png" alt=""><h1>A little space for your day.</h1><p>Starting Daybar…<br>Your planner stays on this computer.</p><div class="bar" role="progressbar" aria-label="Starting Daybar"></div></main></body></html>
